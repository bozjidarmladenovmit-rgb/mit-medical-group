<!DOCTYPE html>
<html lang="mk"><head><meta charset="utf-8">
<style>
  /* 4 s end card for MIT Dental Clinic: bright, in the clinic's navy and teal. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow: hidden; font-family: 'Inter Display', 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  .story { position: relative; width: 1080px; height: 1920px; overflow: hidden;
           background: radial-gradient(90% 60% at 50% 40%, #ffffff 0%, #f2f8fa 60%, #e2eff3 100%); color: #044276; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes up { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes line { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes drift { from { transform: translateY(0); } to { transform: translateY(-40px); } }
  .glow { position: absolute; inset: 0; background: radial-gradient(40% 25% at 50% 38%, rgba(23,163,182,.12), transparent 70%); animation: fade 1s ease-out both; }
  .wrap { position: absolute; left: 70px; right: 70px; top: 470px; text-align: center; animation: drift 4s linear both; }
  .logo { animation: pop 1s cubic-bezier(.2,.8,.2,1) 0s both; }
  .logo img { height: 340px; filter: drop-shadow(0 14px 30px rgba(4,66,118,.18)); }
  .name { margin-top: 40px; font-size: 104px; font-weight: 900; letter-spacing: 3px; line-height: 1; color: #044276; animation: up .9s cubic-bezier(.2,.8,.2,1) .35s both; }
  .name span { color: #17a3b6; }
  .sub { margin-top: 22px; font-size: 44px; font-weight: 600; letter-spacing: 4px; color: #0d5fa1; animation: up .9s cubic-bezier(.2,.8,.2,1) .6s both; }
  .rule { width: 220px; height: 4px; margin: 66px auto; border-radius: 2px; background: #17a3b6; transform-origin: center; animation: line .8s ease-out 1s both; }
  .tag { font-size: 58px; font-weight: 500; line-height: 1.35; color: #24476a; animation: up 1s ease-out 1.3s both; }
  .tag b { font-weight: 800; color: #044276; }
</style></head>
<body data-duration="4"><div class="story canvas">
  <div class="glow"></div>
  <div class="wrap">
    <div class="logo"><img src="../assets/mit-dental-logo.png"></div>
    <div class="name">MIT <span>DENTAL</span><br>CLINIC</div>
    <div class="sub">УНИВЕРЗИТЕТСКА КЛИНИКА</div>
    <div class="rule"></div>
    <div class="tag">Место каде што<br><b>уметноста и науката</b><br>стануваат едно.</div>
  </div>
</div></body></html>
