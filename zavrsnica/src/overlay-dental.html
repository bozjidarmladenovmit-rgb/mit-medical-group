<!DOCTYPE html>
<html lang="mk"><head><meta charset="utf-8">
<style>
  /* Transparent end-card overlay (logo + text) drawn over the last scene of the ad. 4 s. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; font-family: 'Inter Display', 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 1080px; height: 1920px; }
  @keyframes up { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes line { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .wrap { position: absolute; left: 70px; right: 70px; top: 470px; text-align: center; }
  .logo img { height: 340px; filter: drop-shadow(0 10px 30px rgba(255,255,255,.9)) drop-shadow(0 14px 30px rgba(4,66,118,.25)); animation: pop 1s cubic-bezier(.2,.8,.2,1) .1s both; }
  .name { margin-top: 40px; font-size: 104px; font-weight: 900; letter-spacing: 3px; line-height: 1; color: #044276; animation: up .9s cubic-bezier(.2,.8,.2,1) .45s both; }
  .name span { color: #128a9c; }
  .sub { margin-top: 22px; font-size: 44px; font-weight: 700; letter-spacing: 4px; color: #0d5fa1; animation: up .9s cubic-bezier(.2,.8,.2,1) .7s both; }
  .rule { width: 220px; height: 5px; margin: 66px auto; border-radius: 3px; background: #17a3b6; transform-origin: center; animation: line .8s ease-out 1.1s both; }
  .tag { font-size: 60px; font-weight: 600; line-height: 1.35; color: #163a5c; animation: up 1s ease-out 1.4s both; }
  .tag b { font-weight: 900; color: #044276; }
  .name, .sub, .tag { text-shadow: 0 0 24px rgba(255,255,255,.95), 0 0 6px rgba(255,255,255,.9); }
</style></head>
<body data-duration="4"><div class="stage">
  <div class="wrap">
    <div class="logo"><img src="../assets/mit-dental-logo.png"></div>
    <div class="name">MIT <span>DENTAL</span><br>CLINIC</div>
    <div class="sub">УНИВЕРЗИТЕТСКА КЛИНИКА</div>
    <div class="rule"></div>
    <div class="tag">Место каде што<br><b>уметноста и науката</b><br>стануваат едно.</div>
  </div>
</div></body></html>
