<!DOCTYPE html>
<html lang="mk"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="anim.css">
<style>
  /* 14 s New Year video: "a letter to myself in 4 years" — a typed letter, then the greeting. */
  @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  .letter { position: absolute; top: 380px; left: 80px; right: 80px; padding: 70px 64px; transform: rotate(-1.5deg);
            animation: in-up .8s ease-out .3s both, out .6s ease-in 8.6s both; }
  .letter .to { font-size: 40px; font-weight: 800; color: var(--gold); letter-spacing: 2px; margin-bottom: 30px; }
  .letter p { font-size: 50px; font-weight: 700; line-height: 1.45; font-style: italic; }
  .letter p span { display: block; animation: type 1.3s steps(30) both; }
  .letter p span:nth-child(1) { animation-delay: 1.2s; } .letter p span:nth-child(2) { animation-delay: 2.6s; }
  .letter p span:nth-child(3) { animation-delay: 4.0s; } .letter p span:nth-child(4) { animation-delay: 5.4s; }
  .letter .sig { margin-top: 40px; text-align: right; font-size: 42px; font-weight: 800; color: var(--gold); animation: in-up .6s ease-out 6.9s both; }
  .flake { position: absolute; top: 0; color: var(--gold-light); opacity: .6; animation: fall 9s linear both; }
  .greet { position: absolute; top: 560px; left: 70px; right: 70px; text-align: center; }
  .greet .year { font-size: 260px; font-weight: 900; color: var(--gold); animation: pop .8s cubic-bezier(.2,.9,.3,1.3) 9s both; }
  .greet .big { font-size: 104px; margin-top: 10px; animation: in-up .6s ease-out 9.7s both; }
  .greet p { font-size: 46px; font-weight: 700; margin-top: 40px; line-height: 1.35; animation: in-up .6s ease-out 10.5s both; }
</style></head>
<body data-duration="14"><div class="canvas story">
  <div class="arc a"></div><div class="arc b"></div>
  <span class="flake" style="left:10%;font-size:50px;animation-delay:.2s">✻</span>
  <span class="flake" style="left:40%;font-size:34px;animation-delay:2s">✻</span>
  <span class="flake" style="left:70%;font-size:44px;animation-delay:1s">✻</span>
  <span class="flake" style="left:88%;font-size:30px;animation-delay:3.4s">✻</span>
  <div class="header"><img src="../assets/logo-st-lukas-od-screenshot.png"><div class="school">ПРИВАТНО МЕДИЦИНСКО<br>СРЕДНО УЧИЛИШТЕ<br>СВ. ЛУКА</div></div>

  <div class="letter card">
    <div class="to">ДО МЕНЕ, ЗА 4 ГОДИНИ</div>
    <p><span>Се надевам дека сè уште</span><span>ги сакаш луѓето.</span><span>Дека твоите раце знаат</span><span>да помогнат. Верувам во тебе. 💙</span></p>
    <div class="sig">– Јас, прва година</div>
  </div>

  <div class="greet">
    <div class="year">2027</div>
    <div class="big">Среќна <span class="gold">Нова година!</span></div>
    <p>Што би си напишал/а ти?<br>Сподели во коментар 👇</p>
  </div>
</div></body></html>
